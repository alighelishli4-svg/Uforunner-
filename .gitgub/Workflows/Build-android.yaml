name: Extract and Build UFO Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q UFO_Runner_Android_Studio_Release_1.0.0.zip -d extracted
          find extracted -name settings.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find extracted -path '*/android-app/settings.gradle.kts' -print -quit)")
          test -n "$PROJECT"
          gradle --version
          gradle -p "$PROJECT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UFO-Runner-APK
          path: extracted/**/android-app/app/build/outputs/apk/debug/*.apk
